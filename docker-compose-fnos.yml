services:
  sqmusic_main:
    image: ${SQMUSIC_IMAGE:-ghcr.io/longlxx88-gif/sqmusic_lite:latest}
    container_name: sqmusic_lite
    environment:
      SPRING_PROFILES_ACTIVE: lite,kw,mg,qq,netease,kg,tidal
      SQMUSIC_ORIGINAL_SOURCES: "true"
      APP_DATA_DIR: /data
      MCP_ENABLED: "true"
      MCP_STDIO_ENABLED: "false"
      HTTP_PROXY: http://192.168.31.33:7890
      HTTPS_PROXY: http://192.168.31.33:7890
      NO_PROXY: localhost,127.0.0.1,::1,sqmusic_main,sqmusic_web
      JAVA_OPTS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - /vol3/1000/docker/sqmusic_lite/data:/data
      - /vol3/1000/music-api-test:/music
    ports:
      - "8199:8099"
    restart: unless-stopped
  sqmusic_web:
    image: ${SQMUSIC_WEB_IMAGE:-ghcr.io/longlxx88-gif/sqmusic_lite_web:latest}
    container_name: sqmusic_lite_web
    ports:
      - "8196:80"
    depends_on:
      - sqmusic_main
    restart: unless-stopped
