# N1 / ARM64 deployment entrypoint. Use docker-compose-n1.yml for the same config.
services:
  sqmusic_main:
    image: ${SQMUSIC_IMAGE:-ghcr.io/longlxx88-gif/sqmusic_lite:latest}
    platform: linux/arm64
    container_name: sqmusic_lite
    environment:
      SPRING_PROFILES_ACTIVE: n1,kw,mg,qq,netease,kg,tidal
      SQMUSIC_ORIGINAL_SOURCES: "true"
      APP_DATA_DIR: /data
      MCP_ENABLED: "true"
      MCP_STDIO_ENABLED: "false"
      JAVA_OPTS: -Xms64m -Xmx320m -Xss512k -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=160m
    volumes:
      - ./data:/data
      - ./music:/music
    ports:
      - "8099:8099"
    restart: unless-stopped

  sqmusic_web:
    image: ${SQMUSIC_WEB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:latest-arm64}
    platform: linux/arm64
    container_name: sqmusic_lite_web
    ports:
      - "8096:80"
    depends_on:
      - sqmusic_main
    restart: unless-stopped
